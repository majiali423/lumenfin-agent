# Optional operational monitoring overlay.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  lumenfin-api:
    environment:
      MAS_PROMETHEUS_ENABLED: "true"

  lumenfin-worker:
    environment:
      MAS_PROMETHEUS_ENABLED: "true"
      MAS_METRICS_PORT: "9101"
    expose:
      - "9101"

  lumenfin-index-worker:
    environment:
      MAS_PROMETHEUS_ENABLED: "true"
      MAS_METRICS_PORT: "9102"
    expose:
      - "9102"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      lumenfin-api:
        condition: service_healthy
      lumenfin-worker:
        condition: service_started
      lumenfin-index-worker:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lumenfin-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

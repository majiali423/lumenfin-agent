# Queue/worker multi-process infrastructure validation.
# Uses dedicated test DB / queue / collection. Does not replace production compose.
#
#   docker compose -f docker-compose.integration.yml --env-file .env.integration.example up -d
#   python scripts/run_queue_worker_integration.py

name: lumenfin-it

x-app-env: &app-env
  APP_ENV: integration
  DATA_MODE: demo
  ALLOW_LOCAL_FALLBACK: "true"
  MAS_HOST: 0.0.0.0
  MAS_PORT: 8000
  MAS_OUTPUT_DIR: /app/outputs
  MAS_UPLOAD_DIR: /app/uploads
  MAS_DB_PATH: /app/data/unused-sqlite.db
  MAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lumenfin_it}:${POSTGRES_PASSWORD:-lumenfin_it_pass}@postgres:5432/${POSTGRES_DB:-lumenfin_integration}
  MAS_REDIS_URL: redis://redis:6379/0
  MAS_REDIS_QUEUE_NAME: finance-analysis-it
  MAS_REDIS_INDEX_QUEUE_NAME: ${MAS_REDIS_INDEX_QUEUE_NAME:-rag-document-index-it}
  MAS_REDIS_JOB_MAX_ATTEMPTS: ${MAS_REDIS_JOB_MAX_ATTEMPTS:-3}
  MAS_REDIS_RECLAIM_IDLE_SECONDS: ${MAS_REDIS_RECLAIM_IDLE_SECONDS:-5}
  MAS_REDIS_RETRY_BACKOFF_SECONDS: ${MAS_REDIS_RETRY_BACKOFF_SECONDS:-1}
  MAS_MILVUS_URI: http://milvus:19530
  MAS_MILVUS_COLLECTION: ${MAS_MILVUS_COLLECTION:-lumenfin_chunks_it}
  MAS_MILVUS_ISOLATE: "false"
  MAS_EMBEDDING_PROVIDER: deterministic
  MAS_EMBEDDING_DIMENSION: "384"
  MAS_RAG_ENABLED: "true"
  MAS_RAG_BM25_ENABLED: "true"
  MAS_RAG_BM25_RRF_WEIGHT: "1.1"
  MAS_RAG_RERANK_ENABLED: "true"
  MAS_RAG_RERANK_CANDIDATES: "20"
  MAS_RAG_RERANK_PROVIDER: lexical
  MAS_RAG_INDEX_MODE: async_on_upload
  MAS_RAG_INDEX_LEASE_SECONDS: ${MAS_RAG_INDEX_LEASE_SECONDS:-5}
  MAS_RAG_TENANT_ID: default
  MAS_RAG_REQUIRE_READY: "false"
  MAS_FETCH_LIVE_FUNDAMENTALS: "false"
  MAS_FETCH_SEC_FUNDAMENTALS: "false"
  MAS_MARKET_DATA_PROVIDER: fake
  MAS_MARKET_DATA_FALLBACK: fake
  MAS_TOOL_BACKEND: local
  DEEPSEEK_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  PYTHONPATH: /app/src
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumenfin_integration}
      POSTGRES_USER: ${POSTGRES_USER:-lumenfin_it}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumenfin_it_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumenfin_it} -d ${POSTGRES_DB:-lumenfin_integration}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - it_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - it_v3_etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - it_v3_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "${MILVUS_PORT:-19531}:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - it_v3_milvus_data:/var/lib/milvus

  migrator:
    build: .
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "scripts/run_integration_migrations.py"]
    volumes:
      - ./migrations:/app/migrations:ro
    profiles: ["manual"]

  api-a:
    build: .
    environment:
      <<: *app-env
      MAS_WORKER_ID: api-a
      MAS_INTEGRATION_CHECKPOINT_BARRIER_DIR: /integration-hooks/checkpoint-barrier
    ports:
      - "${API_A_PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - it_uploads:/app/uploads
      - it_outputs:/app/outputs
      - ./outputs/queue_worker_integration/hooks:/integration-hooks

  api-b:
    build: .
    environment:
      <<: *app-env
      MAS_WORKER_ID: api-b
      MAS_INTEGRATION_CHECKPOINT_BARRIER_DIR: /integration-hooks/checkpoint-barrier
    ports:
      - "${API_B_PORT:-18081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - it_uploads:/app/uploads
      - it_outputs:/app/outputs
      - ./outputs/queue_worker_integration/hooks:/integration-hooks

  index-worker-a:
    build: .
    command: ["python", "scripts/run_rag_index_worker.py"]
    environment:
      <<: *app-env
      MAS_WORKER_ID: index-worker-a
      MAS_INTEGRATION_INDEX_PAUSE_DIR: /integration-hooks/index-pause
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - it_uploads:/app/uploads
      - it_outputs:/app/outputs
      - ./outputs/queue_worker_integration/hooks:/integration-hooks
    restart: "no"

  index-worker-b:
    build: .
    command: ["python", "scripts/run_rag_index_worker.py"]
    environment:
      <<: *app-env
      MAS_WORKER_ID: index-worker-b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - it_uploads:/app/uploads
      - it_outputs:/app/outputs
      - ./outputs/queue_worker_integration/hooks:/integration-hooks
    restart: "no"

volumes:
  it_postgres_data:
  # Keep all Milvus 3 infrastructure data separate from historical 2.4 test volumes.
  it_v3_etcd_data:
  it_v3_minio_data:
  it_v3_milvus_data:
  it_uploads:
  it_outputs:

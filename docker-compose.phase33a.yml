# Phase 3.3A dual-API provider resilience overlay.
# Usage:
#   docker compose -f docker-compose.integration.yml -f docker-compose.phase33a.yml up -d provider-stub api-a api-b
# Prefer scripts/run_phase33a_dual_api_scenario_g.py for OS-process dual API on developer machines.

services:
  provider-stub:
    build: .
    command: ["python", "scripts/provider_stub/server.py", "--host", "0.0.0.0", "--port", "18090"]
    ports:
      - "${PROVIDER_STUB_PORT:-18090}:18090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18090/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-a:
    environment:
      DEEPSEEK_API_KEY: stub-key
      DEEPSEEK_BASE_URL: http://provider-stub:18090/v1
      DEEPSEEK_MAX_RETRIES: "3"
      DEEPSEEK_TIMEOUT_SECONDS: "5"
      DEEPSEEK_RETRY_BACKOFF_SECONDS: "0.05"
      ALLOW_LOCAL_FALLBACK: "true"
      MAS_ANALYSIS_DEADLINE_SECONDS: "20"
      MAS_LLM_MAX_INFLIGHT_PER_PROCESS: "4"
    depends_on:
      provider-stub:
        condition: service_healthy

  api-b:
    environment:
      DEEPSEEK_API_KEY: stub-key
      DEEPSEEK_BASE_URL: http://provider-stub:18090/v1
      DEEPSEEK_MAX_RETRIES: "3"
      DEEPSEEK_TIMEOUT_SECONDS: "5"
      DEEPSEEK_RETRY_BACKOFF_SECONDS: "0.05"
      ALLOW_LOCAL_FALLBACK: "true"
      MAS_ANALYSIS_DEADLINE_SECONDS: "20"
      MAS_LLM_MAX_INFLIGHT_PER_PROCESS: "4"
    depends_on:
      provider-stub:
        condition: service_healthy

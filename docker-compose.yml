# Production-oriented stack: API + analysis/index workers +
# Postgres/Redis/Milvus.
# MCP servers are intentionally NOT included — optional demo side channel only
# (see docs/MCP.md). Production evidence RAG is in-process LangGraph Retrieval.

x-rag-env: &rag-env
  MAS_RAG_ENABLED: "true"
  # Native BM25 is the production sparse branch after the approved v4 cutover.
  MAS_RAG_BM25_ENABLED: ${MAS_RAG_BM25_ENABLED:-true}
  MAS_RAG_BM25_RRF_WEIGHT: ${MAS_RAG_BM25_RRF_WEIGHT:-1.1}
  # Code default stays lexical; the approved deployment sets qwen3 in .env.
  MAS_RAG_RERANK_ENABLED: ${MAS_RAG_RERANK_ENABLED:-true}
  MAS_RAG_RERANK_CANDIDATES: ${MAS_RAG_RERANK_CANDIDATES:-20}
  MAS_RAG_RERANK_PROVIDER: ${MAS_RAG_RERANK_PROVIDER:-lexical}
  DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-qwen3-rerank}
  DASHSCOPE_RERANK_BASE_URL: ${DASHSCOPE_RERANK_BASE_URL:-}
  MAS_RAG_RERANK_TIMEOUT_SECONDS: ${MAS_RAG_RERANK_TIMEOUT_SECONDS:-12}
  MAS_RAG_RERANK_MAX_ATTEMPTS: ${MAS_RAG_RERANK_MAX_ATTEMPTS:-2}
  MAS_RAG_RERANK_BACKOFF_SECONDS: ${MAS_RAG_RERANK_BACKOFF_SECONDS:-0.25}
  MAS_RAG_RERANK_MAX_INFLIGHT_PER_PROCESS: ${MAS_RAG_RERANK_MAX_INFLIGHT_PER_PROCESS:-2}
  MAS_RAG_RERANK_MAX_DOCUMENT_CHARS: ${MAS_RAG_RERANK_MAX_DOCUMENT_CHARS:-4000}
  MAS_RAG_INDEX_MODE: async_on_upload
  MAS_RAG_INDEX_LEASE_SECONDS: ${MAS_RAG_INDEX_LEASE_SECONDS:-300}
  MAS_RAG_TENANT_ID: ${MAS_RAG_TENANT_ID:-default}
  MAS_MILVUS_URI: http://milvus:19530
  MAS_MILVUS_COLLECTION: ${MAS_MILVUS_COLLECTION:-lumenfin_chunks_v4_bm25}
  MAS_MILVUS_ISOLATE: "false"
  MAS_EMBEDDING_PROVIDER: dashscope
  MAS_EMBEDDING_DIMENSION: ${MAS_EMBEDDING_DIMENSION:-1024}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
  DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}

services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumenfin}
      POSTGRES_USER: ${POSTGRES_USER:-mas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mas_user} -d ${POSTGRES_DB:-lumenfin}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16@sha256:d967d98a12dc220a1a290794711dba7eba04b8ce465e12b02383d1bfbb33e159
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - milvus_v3_etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - milvus_v3_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - ./deploy/milvus-user.yaml:/milvus/configs/user.yaml:ro
      - milvus_v3_vector_data:/var/lib/milvus

  migrator:
    image: lumenfin-agent:${LUMENFIN_IMAGE_TAG:-0.1.0rc4}
    build: .
    environment:
      APP_ENV: production
      MAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mas_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumenfin}
      PYTHONPATH: /app/src
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "scripts/run_integration_migrations.py"]
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"

  lumenfin-api:
    image: lumenfin-agent:${LUMENFIN_IMAGE_TAG:-0.1.0rc4}
    build: .
    restart: unless-stopped
    # Analysis deadline is 120s; retain a buffer for request cleanup.
    stop_grace_period: 150s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    environment:
      <<: *rag-env
      APP_ENV: production
      DATA_MODE: live
      MAS_HOST: 0.0.0.0
      MAS_PORT: 8000
      MAS_OUTPUT_DIR: /app/outputs
      MAS_UPLOAD_DIR: /app/uploads
      MAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mas_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumenfin}
      MAS_REDIS_URL: redis://redis:6379/0
      MAS_REDIS_QUEUE_NAME: finance-analysis
      MAS_REDIS_INDEX_QUEUE_NAME: rag-document-index
      MAS_REDIS_JOB_MAX_ATTEMPTS: ${MAS_REDIS_JOB_MAX_ATTEMPTS:-3}
      MAS_REDIS_RECLAIM_IDLE_SECONDS: ${MAS_REDIS_RECLAIM_IDLE_SECONDS:-30}
      MAS_REDIS_RETRY_BACKOFF_SECONDS: ${MAS_REDIS_RETRY_BACKOFF_SECONDS:-1}
      MAS_MARKET_DATA_PROVIDER: yahoo
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT}
      # Authentication fails closed in app startup unless the legacy key or
      # the multi-principal map provides at least one credential.
      MAS_API_KEY: ${MAS_API_KEY:-}
      MAS_API_KEY_CLIENT_ID: ${MAS_API_KEY_CLIENT_ID:-default-client}
      MAS_API_KEY_TENANT_ID: ${MAS_API_KEY_TENANT_ID:-}
      MAS_API_KEY_PRINCIPALS: ${MAS_API_KEY_PRINCIPALS:-}
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  lumenfin-worker:
    image: lumenfin-agent:${LUMENFIN_IMAGE_TAG:-0.1.0rc4}
    build: .
    restart: unless-stopped
    # Analysis deadline is 120s; retain a buffer for reservation cleanup.
    stop_grace_period: 150s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["python", "start_worker.py"]
    environment:
      <<: *rag-env
      APP_ENV: production
      DATA_MODE: live
      MAS_OUTPUT_DIR: /app/outputs
      MAS_UPLOAD_DIR: /app/uploads
      MAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mas_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumenfin}
      MAS_REDIS_URL: redis://redis:6379/0
      MAS_REDIS_QUEUE_NAME: finance-analysis
      MAS_REDIS_INDEX_QUEUE_NAME: rag-document-index
      MAS_REDIS_JOB_MAX_ATTEMPTS: ${MAS_REDIS_JOB_MAX_ATTEMPTS:-3}
      MAS_REDIS_RECLAIM_IDLE_SECONDS: ${MAS_REDIS_RECLAIM_IDLE_SECONDS:-30}
      MAS_REDIS_RETRY_BACKOFF_SECONDS: ${MAS_REDIS_RETRY_BACKOFF_SECONDS:-1}
      MAS_MARKET_DATA_PROVIDER: yahoo
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT}
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  lumenfin-index-worker:
    image: lumenfin-agent:${LUMENFIN_IMAGE_TAG:-0.1.0rc4}
    build: .
    restart: unless-stopped
    # Index-job deadline is 180s; retain a buffer for lease-safe cleanup.
    stop_grace_period: 210s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["python", "scripts/run_rag_index_worker.py"]
    environment:
      <<: *rag-env
      APP_ENV: production
      DATA_MODE: live
      MAS_WORKER_ID: index-worker
      MAS_OUTPUT_DIR: /app/outputs
      MAS_UPLOAD_DIR: /app/uploads
      MAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mas_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumenfin}
      MAS_REDIS_URL: redis://redis:6379/0
      MAS_REDIS_INDEX_QUEUE_NAME: rag-document-index
      MAS_REDIS_JOB_MAX_ATTEMPTS: ${MAS_REDIS_JOB_MAX_ATTEMPTS:-3}
      MAS_REDIS_RECLAIM_IDLE_SECONDS: ${MAS_REDIS_RECLAIM_IDLE_SECONDS:-30}
      MAS_REDIS_RETRY_BACKOFF_SECONDS: ${MAS_REDIS_RETRY_BACKOFF_SECONDS:-1}
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  redis_data:
  # Milvus 3 uses fresh volumes: direct reuse of the former 2.4 volumes is not
  # a validated upgrade path. Docker keeps those old volumes intact for recovery.
  milvus_v3_etcd_data:
  milvus_v3_minio_data:
  milvus_v3_vector_data:

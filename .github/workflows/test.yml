name: test

# Extended gate (FinAgentBench checkout + cross-repo + RAG eval). Manual / optional.
# Required PR CI is `.github/workflows/ci.yml` (offline suite + FinRun contract
# matrix: FinAgentBench v0.1.0-rc.3 authoritative pin and v0.1.0-rc.4 compatibility).
# This workflow defaults to the frozen pin and does not replace required CI.

on:
  workflow_dispatch:
    inputs:
      finagentbench_ref:
        description: FinAgentBench release tag or commit SHA
        required: false
        default: v0.1.0-rc.3

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Offline CI RAG profile (see lumenfin.rag.profiles.CI_RAG_ENV)
      MAS_RAG_INDEX_MODE: sync_on_run
      MAS_EMBEDDING_PROVIDER: deterministic
      MAS_EMBEDDING_DIMENSION: "384"
      MAS_MILVUS_URI: data/milvus_lite_ci.db
      MAS_MILVUS_COLLECTION: lumenfin_chunks_ci
      MAS_MILVUS_ISOLATE: "true"
      MAS_RAG_RERANK_ENABLED: "true"
      MAS_RAG_DEGRADE_ON_VECTOR_ERROR: "true"
      MAS_RAG_SANITIZE_HITS: "true"
      MAS_REDIS_URL: ""
      FINAGENTBENCH_REF: ${{ github.event.inputs.finagentbench_ref || 'v0.1.0-rc.3' }}
      FINAGENTBENCH_PROFILE: ci
      LUMENFIN_ROOT: ${{ github.workspace }}/lumenfin-agent
      FINAGENTBENCH_DIR: ${{ github.workspace }}/finagentbench-demo
      CROSS_REPO_OUT_DIR: ${{ github.workspace }}/cross_repo_validation

    steps:
      - name: Checkout LumenFin
        uses: actions/checkout@v4
        with:
          path: lumenfin-agent

      - name: Checkout FinAgentBench
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/finagentbench-demo', github.repository_owner) }}
          ref: ${{ env.FINAGENTBENCH_REF }}
          path: finagentbench-demo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        working-directory: lumenfin-agent
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Record FinAgentBench revision
        run: |
          echo "FINAGENTBENCH_REF=${FINAGENTBENCH_REF}"
          echo "LUMENFIN_ROOT=${LUMENFIN_ROOT}"
          echo "FINAGENTBENCH_DIR=${FINAGENTBENCH_DIR}"
          echo "CROSS_REPO_OUT_DIR=${CROSS_REPO_OUT_DIR}"
          git -C "${FINAGENTBENCH_DIR}" rev-parse HEAD
          git -C "${FINAGENTBENCH_DIR}" describe --tags --exact-match HEAD || true

      - name: Install FinAgentBench
        run: python -m pip install -e "${FINAGENTBENCH_DIR}"

      - name: RAG eval release gate
        working-directory: lumenfin-agent
        run: >
          python scripts/run_rag_eval.py
          --gate
          --json-out outputs/rag_eval.json
          --min-pass-rate 1.0
          --min-mean-recall-at-3 1.0
          --min-mean-citation-coverage 1.0
          --min-mean-mrr 0.5
          --min-mean-groundedness 0.2

      - name: Cross-repository FinRun reliability gate
        working-directory: lumenfin-agent
        run: >
          python scripts/run_cross_repo_ci.py
          --profile "${FINAGENTBENCH_PROFILE}"
          --lumenfin-root "${LUMENFIN_ROOT}"
          --finagentbench-root "${FINAGENTBENCH_DIR}"
          --out-dir "${CROSS_REPO_OUT_DIR}"
          --require-clean-lumenfin

      - name: Upload RAG eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval
          path: |
            lumenfin-agent/outputs/rag_eval.json
            ${{ env.CROSS_REPO_OUT_DIR }}/
          if-no-files-found: ignore

name: integration-manual

# Heavy Docker suites (queue/worker integration + provider-resilience dual-API).
# Manual only. Requires a runner with Docker Desktop / Docker Engine and
# substantial disk/RAM. Do not enable as a required check on every commit.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to document/run instructions for
        required: true
        default: both
        type: choice
        options:
          - queue-worker
          - provider-resilience-docker
          - both

jobs:
  instruct:
    name: Print Docker suite commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document required local/Docker commands
        run: |
          echo "## Manual integration suites"
          echo "This workflow does not start Docker Desktop automatically on GitHub-hosted runners"
          echo "with enough resources for Milvus + dual API. Run on a Docker-capable machine:"
          echo ""
          echo "### Queue / worker integration"
          echo "python scripts/run_queue_worker_integration.py"
          echo ""
          echo "### Provider resilience Docker dual-API"
          echo "python scripts/validate_provider_resilience_docker.py"
          echo ""
          echo "Selected suite input: ${{ inputs.suite }}"
          echo "See docs/QUEUE_WORKER_INTEGRATION.md and docs/PROVIDER_RESILIENCE.md"

[project]
name = "lumenfin-agent"
version = "0.1.0rc4"
description = "LumenFin: evidence-grounded financial diligence with LangGraph specialist nodes (planner–critic–repair)."
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "langgraph",
  "networkx",
  "fastapi",
  "uvicorn",
  "httpx",
  "python-dotenv",
  "sqlalchemy",
  "psycopg[binary]",
  "redis",
  "rq",
  "pymupdf",
  "openpyxl>=3.1.0",
  "python-multipart",
  "pydantic>=2.0",
  "yfinance",
  "pymilvus[milvus_lite]==3.0.0",
  "milvus-lite==3.1.0",
  "jieba==0.42.1",
  "mcp>=1.2.0",
]

[project.optional-dependencies]
mcp-agent = [
  "langchain-openai>=0.3.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "lumenfin-agent"
version = "0.1.0rc5"
description = "LumenFin: evidence-grounded financial diligence with LangGraph specialist nodes (planner–critic–repair)."
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "langgraph",
  "networkx",
  "fastapi",
  "uvicorn",
  "httpx",
  "python-dotenv",
  "sqlalchemy",
  "psycopg[binary]",
  "redis",
  "rq",
  "pymupdf",
  "openpyxl>=3.1.0",
  "python-multipart",
  "prometheus-client==0.26.0",
  "pydantic>=2.0",
  "yfinance",
  "pymilvus==3.0.0",
  "milvus-lite==3.1.0",
  "jieba==0.42.1",
  "mcp>=1.2.0",
]

[project.optional-dependencies]
mcp-agent = [
  "langchain-openai>=0.3.0",
  "langchain-core>=0.3.0",
]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["test_artifacts", "outputs", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests/", "scripts/", "eval/"]

